[package]
name = "emulsify"
version = "0.1.0"
edition = "2021"
authors = ["Rory Spring-Vanhorne <rory.spring@icloud.com>"]
description = "Viscosity-based merge compatibility analysis and nearest-neighbour consolidation planning"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
bound-core = { path = "../bound/crates/bound-core" }

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"

[profile.release]
lto = true
